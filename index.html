<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>KOVAI~SURGE | Waste Management Protocol</title>
    <meta name="description" content="KOVAI~SURGE Smart Waste Management Login Portal for Coimbatore"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="surge-effects.css" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4CAF50",
                        "primary-glow": "#53d22d",
                        "background-dark": "#0a0f0a",
                        "card-dark": "rgba(15, 25, 15, 0.75)",
                    },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        /* ---- Animated IoT Grid Background ---- */
        .login-bg {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at 50% 50%, #0d1f0d 0%, #050a05 70%, #000 100%);
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute; inset: -50%;
            background-image: 
                linear-gradient(rgba(76, 175, 80, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76, 175, 80, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(0deg); }
        }
        /* Floating particles */
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: #4CAF50;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 8s infinite;
            box-shadow: 0 0 6px #4CAF50, 0 0 12px #4CAF5066;
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-20vh) scale(1.5); }
        }
        /* Glassmorphism card */
        .glass-card {
            background: rgba(10, 20, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(76, 175, 80, 0.15);
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.05), 0 25px 50px rgba(0,0,0,0.5);
        }
        .glass-card:hover {
            border-color: rgba(76, 175, 80, 0.3);
            box-shadow: 0 0 60px rgba(76, 175, 80, 0.1), 0 25px 50px rgba(0,0,0,0.5);
        }
        /* Neon glow input */
        .neon-input {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(76, 175, 80, 0.2) !important;
            color: #ffffff !important;
            caret-color: #4CAF50;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        .neon-input::placeholder {
            color: #555 !important;
        }
        .neon-input:focus {
            background: rgba(0, 0, 0, 0.7) !important;
            border-color: #4CAF50 !important;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.2), inset 0 0 15px rgba(76, 175, 80, 0.05);
            color: #ffffff !important;
        }
        /* Cursor tracer */
        .cursor-tracer {
            position: fixed;
            width: 20px; height: 20px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            background: radial-gradient(circle, rgba(76,175,80,0.6) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out, width 0.3s, height 0.3s;
        }
        .cursor-trail {
            position: fixed;
            width: 8px; height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            background: rgba(76, 175, 80, 0.3);
            transform: translate(-50%, -50%);
            transition: opacity 0.5s;
        }
        /* Glow button */
        .glow-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .glow-btn::before {
            content: '';
            position: absolute; inset: -2px;
            background: linear-gradient(135deg, #4CAF50, #81C784, #4CAF50);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.3s;
        }
        .glow-btn:hover::before { opacity: 1; }
        .glow-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
        /* Logo glow */
        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.4));
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.4)); }
            50% { filter: drop-shadow(0 0 35px rgba(76, 175, 80, 0.6)); }
        }
        /* Role badges */
        .role-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border: 1px solid;
            transition: all 0.3s;
        }
        .role-badge:hover { transform: scale(1.05); }
        /* Error toast */
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: rgba(250, 75, 56, 0.9); color: white; border: 1px solid #fa4b38; }
        .toast.success { background: rgba(76, 175, 80, 0.9); color: white; border: 1px solid #4CAF50; }
        /* Loading spinner */
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Fade in animation */
        .fade-up {
            opacity: 0; transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-display">

    <!-- Animated Background -->
    <div class="login-bg">
        <div class="particle" style="left:10%;animation-delay:0s;"></div>
        <div class="particle" style="left:20%;animation-delay:1.5s;"></div>
        <div class="particle" style="left:35%;animation-delay:3s;"></div>
        <div class="particle" style="left:50%;animation-delay:0.8s;"></div>
        <div class="particle" style="left:65%;animation-delay:4s;"></div>
        <div class="particle" style="left:80%;animation-delay:2s;"></div>
        <div class="particle" style="left:90%;animation-delay:5s;"></div>
        <div class="particle" style="left:45%;animation-delay:6s;"></div>
        <div class="particle" style="left:75%;animation-delay:1s;"></div>
        <div class="particle" style="left:30%;animation-delay:7s;"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Login Card -->
    <div class="relative flex h-screen w-full flex-col justify-center items-center p-4 z-10">
        <div class="glass-card rounded-2xl max-w-md w-full p-8 fade-up">
            
            <!-- Logo & Title -->
            <div class="flex flex-col items-center mb-8">
                <div class="logo-glow mb-4">
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary/20 to-primary/5 border border-primary/30 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-5xl">eco</span>
                    </div>
                </div>
                <h1 class="text-white text-3xl font-bold tracking-[0.2em]">KOVAI~SURGE</h1>
                <p class="text-primary text-sm tracking-[0.3em] mt-1 uppercase">Waste Management Protocol</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="flex flex-col gap-5">
                <label class="flex flex-col gap-2">
                    <p class="text-gray-400 text-sm font-medium flex items-center gap-2">
                        <span class="material-symbols-outlined text-base text-primary/60">mail</span>
                        Email Address
                    </p>
                    <input id="emailInput" class="neon-input rounded-lg text-white h-12 px-4 text-sm font-normal outline-none w-full placeholder:text-gray-600" placeholder="Enter your email" type="email" required autocomplete="email"/>
                </label>
                <label class="flex flex-col gap-2">
                    <p class="text-gray-400 text-sm font-medium flex items-center gap-2">
                        <span class="material-symbols-outlined text-base text-primary/60">lock</span>
                        Password
                    </p>
                    <div class="relative">
                        <input id="passwordInput" class="neon-input rounded-lg text-white h-12 px-4 pr-12 text-sm font-normal outline-none w-full placeholder:text-gray-600" placeholder="Enter your password" type="password" required autocomplete="current-password"/>
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </label>
                
                <button id="loginBtn" type="submit" class="glow-btn rounded-lg h-12 text-white text-base font-bold tracking-wide mt-2 flex items-center justify-center gap-2">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="material-symbols-outlined spinner hidden">progress_activity</span>
                </button>
                
                <p class="text-center">
                    <a class="text-primary/70 hover:text-primary text-sm font-medium transition-colors" href="password-reset.html">Forgot Password?</a>
                </p>
            </form>



            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-500 text-sm">New to the portal? <a class="text-primary hover:underline font-semibold" href="citizen-register.html">Register as a Citizen</a></p>
            </div>

            <div class="mt-4 rounded-lg border border-primary/30 bg-black/30 p-3 text-xs">
                <p class="text-primary font-semibold tracking-wide mb-1">Note</p>
                <p class="text-gray-300">Worker accounts now operate only in the mobile app (Worker Ops).</p>
                <p class="text-gray-300">Web portal supports admin (<span class="text-white font-semibold">@ad.in</span>) and citizen (<span class="text-white font-semibold">@gmail.com</span>) login.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
    <script src="surge-effects.js"></script>
</body>
</html>
