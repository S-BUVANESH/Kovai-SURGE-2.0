<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Report an Issue | KOVAI~SURGE</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#53d22d", "background-dark": "#0c1a0c" }, fontFamily: { "display": ["Space Grotesk", "sans-serif"] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
    <link href="surge-effects.css" rel="stylesheet"/>
    <style>
        .form-input { width:100%;background:rgba(0,0,0,0.6) !important;border:1px solid rgba(83,210,45,0.15) !important;border-radius:12px;color:#fff !important;padding:12px 16px;font-size:14px;font-family:'Space Grotesk',sans-serif;transition:all 0.3s;outline:none;-webkit-appearance:none;appearance:none;caret-color:#53d22d; }
        .form-input::placeholder { color:#555 !important; }
        .form-input:focus { background:rgba(0,0,0,0.7) !important;border-color:#53d22d !important;box-shadow:0 0 15px rgba(83,210,45,0.15);color:#fff !important; }
        .glass-card { background:rgba(17,26,17,0.6);border:1px solid rgba(83,210,45,0.1);border-radius:16px; }

        /* Location Autocomplete */
        .location-wrapper { position: relative; }
        .location-suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: rgba(10, 20, 10, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(83, 210, 45, 0.2);
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }
        .location-suggestions.active { display: block; }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }
        .suggestion-item:hover, .suggestion-item.selected {
            background: rgba(83, 210, 45, 0.08);
        }
        .suggestion-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
        .suggestion-icon {
            width: 28px; height: 28px; border-radius: 8px;
            background: rgba(83, 210, 45, 0.1);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }
        .suggestion-name { color: #fff; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .suggestion-address { color: #888; font-size: 11px; margin-top: 2px; line-height: 1.3; }
        .search-spinner {
            padding: 16px;
            text-align: center;
            color: #53d22d;
            font-size: 13px;
        }
        .location-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(83, 210, 45, 0.1);
            border: 1px solid rgba(83, 210, 45, 0.2);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            color: #53d22d;
            margin-top: 6px;
        }
        /* Custom scrollbar for suggestions */
        .location-suggestions::-webkit-scrollbar { width: 4px; }
        .location-suggestions::-webkit-scrollbar-track { background: transparent; }
        .location-suggestions::-webkit-scrollbar-thumb { background: rgba(83,210,45,0.2); border-radius: 4px; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55); }
        .toast.show { transform: translateX(0); }
        .toast.success { background: rgba(76,175,80,0.9); color: white; border: 1px solid #53d22d; }
        .toast.error { background: rgba(250,75,56,0.9); color: white; }
    </style>
</head>
<body class="bg-background-dark font-display text-white">
<div id="toast" class="toast"></div>
<main class="p-6 lg:p-8 max-w-2xl mx-auto">
    <a href="citizen-dashboard.html" class="flex items-center gap-2 text-primary hover:underline text-sm font-medium mb-6">
        <span class="material-symbols-outlined text-sm">arrow_back</span>Back to Dashboard
    </a>
    <header>
        <p class="text-3xl font-black">Report an Issue</p>
        <p class="text-[#a5b6a0] text-sm mt-1">Help us keep Coimbatore clean. Let us know what's wrong.</p>
    </header>
    <form id="issue-form" class="mt-6 space-y-5 glass-card p-8">
        <div>
            <label class="block text-xs font-bold text-[#a5b6a0] mb-2 tracking-wider uppercase" for="issue-type">Type of Issue</label>
            <select id="issue-type" class="form-input">
                <option>Overflowing Bin</option><option>Damaged Bin</option><option>Missed Collection</option><option>Illegal Dumping</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold text-[#a5b6a0] mb-2 tracking-wider uppercase" for="issue-location">
                <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-primary text-sm">search</span>
                    Location (Search any place)
                </span>
            </label>
            <div class="location-wrapper">
                <input type="text" id="issue-location" class="form-input" placeholder="Search... e.g. KCT, Gandhipuram, RS Puram" autocomplete="off" required>
                <div id="location-suggestions" class="location-suggestions"></div>
            </div>
            <div id="selected-location-info" style="display:none;"></div>
        </div>
        <div>
            <label class="block text-xs font-bold text-[#a5b6a0] mb-2 tracking-wider uppercase" for="issue-comments">Description</label>
            <textarea id="issue-comments" rows="4" class="form-input" placeholder="Describe the issue in detail..."></textarea>
        </div>
        <button type="submit" id="submit-btn" class="w-full h-12 bg-primary text-background-dark font-bold rounded-xl transition-all hover:shadow-[0_0_20px_rgba(83,210,45,0.3)] text-base">Submit Report</button>
    </form>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="db.js"></script>
<script src="report-issue.js"></script>
<script src="surge-effects.js"></script>
</body>
</html>
